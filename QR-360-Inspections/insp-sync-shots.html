<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR360 — Sync / hydrate photos</title>
<style>
  :root{
    --bg:#0c1219; --panel:#15202b; --line:#2a3a4a; --ink:#e8eef4; --dim:#8fa3b5;
    --accent:#3fa9ff; --ok:#3dd68c; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);padding:24px}
  h1{font-size:22px;margin:0 0 6px}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);margin:0 0 22px;max-width:720px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;max-width:820px}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  .btn{appearance:none;border:1px solid var(--line);background:#1c2a38;color:var(--ink);
    border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
  .btn.primary{background:var(--accent);color:#04121f;border-color:transparent;font-weight:700}
  .btn:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .note{color:var(--dim);font-size:13px;margin-top:8px}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--dim);font-weight:600}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  img.thumb{width:56px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#000}
  input[type=file]{max-width:100%}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim);margin-left:8px}
  .badge.skel{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
  <h1>QR<span>360</span> PC sync / hydrate</h1>
  <p class="sub">
    Match field <b>shoot log</b> or a <b>360skeleton</b> (drawing + pins, no photos) to JPGs downloaded from the X5.
    Rule: <b>shot N = Nth photo</b> sorted by capture time (fallback: file name). Output is a hydrated <b>.insp360</b>.
  </p>

  <div class="card">
    <label>1. Shoot log or 360skeleton (.json / .zip / .360skeleton / .insp360)</label>
    <input type="file" id="logFile" accept=".json,.zip,.360skeleton,.insp360,application/json,application/zip">
    <div class="note" id="logStatus">No project loaded.</div>
  </div>

  <div class="card">
    <label>2. Camera photos (folder or multi-select JPGs from this session)</label>
    <div class="row">
      <button class="btn" type="button" id="folderBtn">Choose folder</button>
      <input type="file" id="photoFiles" accept="image/jpeg,image/jpg,.jpg,.jpeg" multiple>
    </div>
    <div class="note" id="photoStatus">No photos selected.</div>
  </div>

  <div class="card">
    <div class="row">
      <button class="btn primary" id="matchBtn" disabled>Match by shot order</button>
      <button class="btn" id="matchTimeBtn" disabled>Auto: by time</button>
      <button class="btn" id="buildBtn" disabled>Build / hydrate .insp360</button>
      <button class="btn" id="renameBtn" disabled>Download renamed JPGs</button>
    </div>
    <div class="note" id="matchStatus"></div>
    <div style="overflow:auto;max-height:420px">
      <table>
        <thead><tr><th>#</th><th>Pin</th><th>Photo</th><th>Preview</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let LOG=null, PLAN_BYTES=null, PLAN_NAME=null, PLAN_KIND=null, DRAFT=null;
let TOUR=null; // existing tour.json from 360skeleton / skeleton archive
let SKEL_ZIP=null; // original skeleton zip (to preserve other entries)
let PHOTOS=[]; // {file, name, lastMod, time, viaExif, url}
let MATCHES=[]; // {shot, pin, file}
let ADDR_WARN=""; // folder-name vs project-address warning (folder picks only)
let LAST_DIR_NAME=""; // last picked directory name (empty for multi-file selection)

function toast(el, msg, ok){
  el.className="note "+(ok===true?"ok":ok===false?"bad":"");
  el.textContent=msg;
}

/* Status line under the match buttons, prefixed with any folder↔address warning. */
function setMatchStatus(msg, ok){
  const el=$("#matchStatus");
  if(ADDR_WARN){ el.className="note bad"; el.textContent=ADDR_WARN+(msg?"  —  "+msg:""); }
  else toast(el, msg, ok);
}

/* ============================================================
   EXIF (best-effort: DateTimeOriginal + GPS) — ported from
   QR360-Capture insp-capture_14.html (readExif / parseTiff).
   Returns {date, dateMs, lat, lng}.
   ============================================================ */
function readExif(buf){
  const out={date:null,lat:null,lng:null};
  try{
    const dv=new DataView(buf);
    if(dv.getUint16(0)!==0xFFD8)return out;
    let off=2;
    while(off+4<dv.byteLength){
      const marker=dv.getUint16(off);
      if((marker&0xFF00)!==0xFF00)break;
      const size=dv.getUint16(off+2);
      if(marker===0xFFE1 && dv.getUint32(off+4)===0x45786966){ parseTiff(dv,off+10,out); return out; }
      off+=2+size;
    }
  }catch(e){}
  return out;
}
function parseTiff(dv,base,out){
  const le=dv.getUint16(base)===0x4949;
  const u16=o=>dv.getUint16(base+o,le), u32=o=>dv.getUint32(base+o,le);
  const ifd0=u32(4);
  function walk(ifdOff,gps){
    const n=u16(ifdOff); let o=ifdOff+2;
    for(let i=0;i<n;i++,o+=12){
      const tag=u16(o), type=u16(o+2), cnt=u32(o+4);
      const valOff=(type===2&&cnt>4)||(type===5)?u32(o+8):o+8;
      if(!gps){
        if(tag===0x9003||tag===0x0132){ out.date=out.date||readAscii(valOff,cnt); }
        if(tag===0x8825){ walk(u32(o+8),true); }
      }else{
        if(tag===1) out._latRef=readAscii(valOff,cnt);
        if(tag===3) out._lngRef=readAscii(valOff,cnt);
        if(tag===2) out.lat=readRational3(valOff);
        if(tag===4) out.lng=readRational3(valOff);
      }
    }
  }
  function readAscii(o,cnt){let s="";for(let i=0;i<cnt;i++){const c=dv.getUint8(base+o+i);if(!c)break;s+=String.fromCharCode(c);}return s;}
  function readRational3(o){const r=i=>u32(o+i*8)/(u32(o+i*8+4)||1);return r(0)+r(1)/60+r(2)/3600;}
  walk(ifd0,false);
  if(out.lat!=null&&out._latRef==="S")out.lat=-out.lat;
  if(out.lng!=null&&out._lngRef==="W")out.lng=-out.lng;
  if(out.date){ // "YYYY:MM:DD HH:MM:SS" -> ms
    const m=out.date.match(/(\d{4}):(\d{2}):(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
    if(m)out.dateMs=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();
  }
}

/* Effective capture time for a photo: EXIF DateTimeOriginal if present, else file date. */
async function photoTime(file){
  let time=file.lastModified||0, viaExif=false;
  try{
    const buf=await file.slice(0,131072).arrayBuffer();
    const ex=readExif(buf);
    if(ex.dateMs){ time=ex.dateMs; viaExif=true; }
  }catch(e){}
  return {time, viaExif};
}

function fmtDelta(ms){
  const s=Math.round(Math.abs(ms)/1000);
  if(s<90)return (ms<0?"-":"")+s+"s";
  const m=Math.round(s/60); if(m<90)return (ms<0?"-":"")+m+"m";
  return (ms<0?"-":"")+Math.round(m/60)+"h";
}

/* Normalize for loose comparison: trim, lowercase, _/- -> space, collapse whitespace. */
function normLoose(s){ return String(s||"").trim().toLowerCase().replace(/[_-]/g," ").replace(/\s+/g," ").trim(); }

/* Compare last picked folder name to project address; set ADDR_WARN (folder picks only). */
function checkFolderAddress(){
  ADDR_WARN="";
  if(!LAST_DIR_NAME || !LOG) return;
  const addr=(LOG.project&&LOG.project.address)||"";
  const a=normLoose(LAST_DIR_NAME), b=normLoose(addr);
  if(!a || !b) return; // nothing to compare against
  if(a!==b){
    ADDR_WARN=`⚠ Folder name "${LAST_DIR_NAME}" doesn't match project address "${addr}" — check you picked the right folder (proceeding anyway).`;
  }
}

/* Effective shot time in ms: prefer ts, else parse iso, else null. */
function shotMs(s){
  if(s&&s.ts!=null&&s.ts!=="") return +s.ts;
  if(s&&s.iso){ const t=Date.parse(s.iso); if(!isNaN(t)) return t; }
  return null;
}
function shotsHaveTime(){ return (LOG&&LOG.shots||[]).some(s=>shotMs(s)!=null); }

function shotsFromTour(tour){
  const order=(tour&&tour.order)||[];
  const markers=((tour.plan&&tour.plan.plans&&tour.plan.plans[0]&&tour.plan.plans[0].markers)||[]);
  return order.map((fn,i)=>{
    const m=markers.find(x=>x.target===fn)||markers[i]||{};
    const name=String(fn).replace(/\.jpe?g$/i,"");
    return {
      shot:i+1,
      pinSeq:i+1,
      name,
      x:m.x, y:m.y,
      note:m.label||"",
      page:1
    };
  });
}

async function loadSkeletonZip(file){
  const zip=await JSZip.loadAsync(file);
  SKEL_ZIP=zip;
  const tourEntry=zip.file("tour.json")||Object.values(zip.files).find(x=>/tour\.json$/i.test(x.name));
  if(tourEntry) TOUR=JSON.parse(await tourEntry.async("string"));
  const logEntry=zip.file("shoot-log.json")||Object.values(zip.files).find(x=>/shoot-log\.json$/i.test(x.name));
  if(logEntry) LOG=JSON.parse(await logEntry.async("string"));
  const draft=zip.file("capture-draft.json");
  if(draft) DRAFT=JSON.parse(await draft.async("string"));
  if(!LOG || LOG.type!=="insp360-shoot-log"){
    if(!TOUR) throw new Error("No tour.json or shoot-log.json in archive");
    // Synthesize shoot-log from skeleton markers / order
    const shots=shotsFromTour(TOUR);
    LOG={
      type:"insp360-shoot-log",
      version:1,
      syncRule:"Match shot N to the Nth camera photo sorted by capture time (or file name).",
      project:Object.assign({name:"",address:"",prefix:""}, TOUR.meta||{}),
      shots,
      pins:shots.map(s=>({seq:s.pinSeq,name:s.name,x:s.x,y:s.y,note:s.note,shotIndex:s.shot}))
    };
  }
  const planKey=Object.keys(zip.files).find(k=>/\.(pdf|png|jpe?g)$/i.test(k)&&!/shoot-log|draft|tour/i.test(k)&&!/\.jpg$/i.test(k.split("/").pop()));
  // Prefer plan embedded in tour.json; also try loose plan file
  if(planKey && !/\.jpg$/i.test(planKey)){
    PLAN_BYTES=await zip.file(planKey).async("uint8array");
    PLAN_NAME=planKey.split("/").pop();
    PLAN_KIND=/\.pdf$/i.test(planKey)?"pdf":"img";
  }
}

$("#logFile").onchange=async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  LOG=null; PLAN_BYTES=null; DRAFT=null; TOUR=null; SKEL_ZIP=null; MATCHES=[];
  try{
    if(/\.(zip|insp360|360skeleton)$/i.test(f.name)){
      await loadSkeletonZip(f);
    } else {
      LOG=JSON.parse(await f.text());
    }
    if(!LOG||LOG.type!=="insp360-shoot-log") throw new Error("Not an insp360-shoot-log / 360skeleton project");
    const n=(LOG.shots||[]).length;
    const skel=TOUR&&TOUR.meta&&(TOUR.meta.status==="skeleton"||TOUR.meta.pendingPhotos)||/\.360skeleton$/i.test(f.name);
    const badge=skel?' <span class="badge skel">360skeleton</span>':'';
    toast($("#logStatus"), `Loaded ${n} shot slot(s) · ${LOG.project&&LOG.project.name||TOUR&&TOUR.meta&&TOUR.meta.name||"project"} · prefix ${LOG.project&&LOG.project.prefix||"?"}`, true);
    $("#logStatus").innerHTML=$("#logStatus").textContent+badge;
    $("#matchBtn").disabled=!PHOTOS.length;
    $("#matchTimeBtn").disabled=!PHOTOS.length;
    checkFolderAddress();
    if(PHOTOS.length) runDefaultMatch(); else if(ADDR_WARN) setMatchStatus("");
  }catch(err){
    toast($("#logStatus"), String(err.message||err), false);
  }
  renderRows();
};

function finishMatch(shots){
  const missing=MATCHES.filter(m=>!m.file).length;
  const extra=Math.max(0, PHOTOS.length-shots.length);
  $("#buildBtn").disabled=!MATCHES.some(m=>m.file);
  $("#renameBtn").disabled=!MATCHES.some(m=>m.file);
  renderRows();
  return {missing, extra, matched:MATCHES.filter(m=>m.file).length};
}

function runMatchByShotOrder(){
  if(!LOG||!PHOTOS.length) return;
  const shots=[...(LOG.shots||[])].sort((a,b)=>a.shot-b.shot);
  MATCHES=shots.map((s,i)=>{
    const photo=PHOTOS[i]||null;
    return { shot:s.shot, pin:s, file:photo };
  });
  const {missing, extra, matched}=finishMatch(shots);
  setMatchStatus(
    `Matched ${matched}/${shots.length} by shot order`+
    (missing?` · ${missing} shots missing photos`:``)+
    (extra?` · ${extra} extra photos ignored`:``)+
    ` · rename target: pin name.jpg`,
    missing?false:true);
}

// Pair each shot with its nearest unused photo after removing the median
// phone↔camera clock offset — mirrors autoByTime in insp-capture_14.html.
function runMatchByTime(){
  if(!LOG||!PHOTOS.length) return;
  const shots=[...(LOG.shots||[])].sort((a,b)=>a.shot-b.shot);
  const files=PHOTOS; // already sorted by effective time
  const k=Math.min(shots.length, files.length), diffs=[];
  for(let i=0;i<k;i++){ const st=shotMs(shots[i]); diffs.push(files[i].time-(st==null?files[i].time:st)); }
  diffs.sort((a,b)=>a-b);
  const off=diffs.length?(diffs[Math.floor(diffs.length/2)]||0):0;
  const used=new Set();
  MATCHES=shots.map(s=>{
    const st=shotMs(s);
    let best=-1, bd=Infinity;
    for(let j=0;j<files.length;j++){
      if(used.has(j)) continue;
      const target=(st==null)?(files[j].time-off):st;
      const d=Math.abs((files[j].time-off)-target);
      if(d<bd){ bd=d; best=j; }
    }
    if(best>=0) used.add(best);
    return { shot:s.shot, pin:s, file: best>=0?files[best]:null };
  });
  const {missing, extra, matched}=finishMatch(shots);
  setMatchStatus(
    `Matched ${matched}/${shots.length} by time (clock offset ${fmtDelta(off)})`+
    (missing?` · ${missing} shots missing photos`:``)+
    (extra?` · ${extra} extra photos ignored`:``)+
    ` · rename target: pin name.jpg`,
    missing?false:true);
}

// Default matcher: prefer time when the shoot-log shots carry ts/iso, else shot order.
function runDefaultMatch(){
  if(shotsHaveTime()) runMatchByTime(); else runMatchByShotOrder();
}

async function ingestPhotoFiles(files){
  toast($("#photoStatus"), `Reading ${files.length} photo(s)…`);
  const infos=[];
  for(const file of files){
    const {time, viaExif}=await photoTime(file);
    infos.push({ file, name:file.name, lastMod:file.lastModified||0, time, viaExif, url:URL.createObjectURL(file) });
  }
  PHOTOS=infos;
  PHOTOS.sort((a,b)=> (a.time-b.time) || a.name.localeCompare(b.name, undefined, {numeric:true}));
  const anyExif=PHOTOS.some(p=>p.viaExif);
  toast($("#photoStatus"), `${PHOTOS.length} photo(s) — sorted by ${anyExif?"EXIF capture time":"file date"} then name`, true);
  $("#matchBtn").disabled=!LOG;
  $("#matchTimeBtn").disabled=!LOG;
  MATCHES=[];
  renderRows();
  if(LOG && PHOTOS.length) runDefaultMatch();
  else if(ADDR_WARN) setMatchStatus("");
}

$("#photoFiles").onchange=e=>{
  ADDR_WARN=""; LAST_DIR_NAME=""; // multi-file selection skips the folder↔address check
  ingestPhotoFiles([...e.target.files||[]]);
};

$("#folderBtn").onclick=async()=>{
  if(!window.showDirectoryPicker){
    toast($("#photoStatus"), "Folder picker not supported — use multi-select below", false);
    $("#photoFiles").click();
    return;
  }
  try{
    const dir=await showDirectoryPicker();
    const files=[];
    for await (const [,handle] of dir.entries()){
      if(handle.kind!=="file") continue;
      const file=await handle.getFile();
      if(/\.(jpe?g)$/i.test(file.name)) files.push(file);
    }
    if(!files.length) throw new Error("No JPG files in folder");
    LAST_DIR_NAME=dir.name||"";
    checkFolderAddress();
    await ingestPhotoFiles(files);
  }catch(err){
    if(err&&err.name==="AbortError") return;
    toast($("#photoStatus"), String(err.message||err), false);
  }
};

$("#matchBtn").onclick=()=>runMatchByShotOrder();
$("#matchTimeBtn").onclick=()=>runMatchByTime();

function renderRows(){
  const tb=$("#rows"); tb.innerHTML="";
  const list=MATCHES.length?MATCHES:(LOG&&LOG.shots||[]).map(s=>({shot:s.shot,pin:s,file:null}));
  list.forEach(m=>{
    const tr=document.createElement("tr");
    const pin=m.pin||{};
    tr.innerHTML=`
      <td class="mono">${m.shot||pin.shot||""}</td>
      <td>${esc(pin.name||"")}<div class="note" style="margin:0">seq ${pin.pinSeq||pin.seq||""}</div></td>
      <td class="mono">${m.file?esc(m.file.name):"—"}</td>
      <td>${m.file?`<img class="thumb" src="${m.file.url}" alt="">`:""}</td>`;
    tb.appendChild(tr);
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function bytesToB64(u8){
  let s=""; const CH=0x8000;
  for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null, u8.subarray(i,i+CH));
  return btoa(s);
}

function buildTour(){
  if(TOUR && TOUR.version){
    // Hydrate existing skeleton tour.json
    const out=JSON.parse(JSON.stringify(TOUR));
    const order=[], tours={};
    MATCHES.filter(m=>m.file).forEach(m=>{
      const fn=(m.pin.name||("shot"+m.shot))+".jpg";
      order.push(fn);
      tours[fn]=(out.tours&&out.tours[fn])||{ objects:[], view:{ lon:0, lat:0, fov:90 } };
    });
    out.order=order;
    out.tours=tours;
    if(out.meta){
      delete out.meta.status;
      delete out.meta.pendingPhotos;
      out.meta.modified=new Date().toISOString();
    }
    // Refresh marker targets from matched pins
    if(out.plan&&out.plan.plans&&out.plan.plans[0]){
      out.plan.plans[0].markers=MATCHES.filter(m=>m.file).map(m=>({
        x:+(+m.pin.x||0.5).toFixed(6),
        y:+(+m.pin.y||0.5).toFixed(6),
        target:(m.pin.name||("shot"+m.shot))+".jpg",
        label:m.pin.note||m.pin.name||""
      }));
    }
    return out;
  }
  const order=[], tours={}, markers=[];
  MATCHES.filter(m=>m.file).forEach(m=>{
    const fn=(m.pin.name||("shot"+m.shot))+".jpg";
    order.push(fn);
    tours[fn]={ objects:[], view:{ lon:0, lat:0, fov:90 } };
    markers.push({
      x:+(+m.pin.x||0.5).toFixed(6),
      y:+(+m.pin.y||0.5).toFixed(6),
      target:fn,
      label:m.pin.note||m.pin.name||""
    });
  });
  const meta=Object.assign({
    name:"", address:"", tenant:"", sf:"", creator:"", type:"",
    created:new Date().toISOString(), modified:new Date().toISOString()
  }, LOG.project||{});
  const out={ version:2, lockView:true, north:null, tours, order, meta };
  if(markers.length){
    const plan={ name:PLAN_NAME||"Floor plan", markers };
    if(PLAN_BYTES){
      const b64=bytesToB64(PLAN_BYTES);
      if(PLAN_KIND==="img") plan.img="data:image/png;base64,"+b64;
      else plan.pdf=b64;
    } else if(TOUR&&TOUR.plan&&TOUR.plan.plans&&TOUR.plan.plans[0]){
      const src=TOUR.plan.plans[0];
      if(src.pdf) plan.pdf=src.pdf;
      if(src.img) plan.img=src.img;
      if(src.name) plan.name=src.name;
    }
    out.plan={ active:0, plans:[plan] };
  }
  return out;
}

function inspName(){
  if(TOUR&&TOUR.meta){
    const addr=TOUR.meta.address||"";
    const title=TOUR.meta.name||"FieldCapture";
    const m=String(addr).match(/^(\d{1,6})\b/);
    const stem=m?m[1]:((LOG.project&&LOG.project.prefix)||"site");
    let t=String(title).replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim();
    if(stem && !t.toLowerCase().startsWith(String(stem).toLowerCase())) t=(stem+" "+t).trim();
    return t+".insp360";
  }
  const addr=(LOG.project&&LOG.project.address)||"";
  const title=(LOG.project&&LOG.project.name)||"FieldCapture";
  const m=String(addr).match(/^(\d{1,6})\b/);
  const stem=m?m[1]:((LOG.project&&LOG.project.prefix)||"site");
  return `${stem} ${title}`.replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim()+".insp360";
}

$("#buildBtn").onclick=async()=>{
  try{
    const zip=new JSZip();
    for(const m of MATCHES){
      if(!m.file) continue;
      const fn=(m.pin.name||("shot"+m.shot))+".jpg";
      zip.file(fn, m.file.file, {compression:"STORE"});
    }
    zip.file("tour.json", JSON.stringify(buildTour(),null,2), {compression:"STORE"});
    if(DRAFT) zip.file("capture-draft.json", JSON.stringify(DRAFT,null,2), {compression:"STORE"});
    zip.file("shoot-log.json", JSON.stringify(LOG,null,2), {compression:"STORE"});
    const blob=await zip.generateAsync({type:"blob", compression:"STORE"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=inspName();
    a.click();
    toast($("#matchStatus"), "Saved "+inspName()+" — open in the viewer / re-upload to cloud", true);
  }catch(e){
    toast($("#matchStatus"), String(e.message||e), false);
  }
};

$("#renameBtn").onclick=async()=>{
  const zip=new JSZip();
  for(const m of MATCHES){
    if(!m.file) continue;
    zip.file((m.pin.name||("shot"+m.shot))+".jpg", m.file.file, {compression:"STORE"});
  }
  const blob=await zip.generateAsync({type:"blob", compression:"STORE"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=((LOG.project&&LOG.project.prefix)||"site")+"_renamed_photos.zip";
  a.click();
};
</script>
</body>
</html>
